plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'dev.tony.visuals'
base { archivesName = 'flop-visuals' }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.compilerArgs += ["-Xmaxerrs", "2000"] }

// Automated in-game screenshot test (runs on GitHub with a virtual display).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "flop-visuals-test"
        enableGameTests = false
        eula = true
    }
}

// Enough memory for the in-game screenshot test (world generation stalled on garbage collection).
loom {
    accessWidenerPath = file("src/main/resources/flopvisuals.accesswidener")
    runs {
        configureEach {
            vmArgs "-Xmx4G", "-Xms2G", "-XX:+UseG1GC"
        }
    }
}
