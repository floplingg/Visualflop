name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Read version
        id: v
        run: |
          echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          rm -f build/libs/*-sources.jar
      - uses: actions/upload-artifact@v4
        with:
          name: flop-visuals-${{ steps.v.outputs.version }}
          path: build/libs/flop-visuals-*.jar
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Flop Visuals ${{ steps.v.outputs.version }}
          make_latest: true
          files: build/libs/flop-visuals-${{ steps.v.outputs.version }}.jar
