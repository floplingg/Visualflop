name: Probe 26.3
on:
  push:
    branches: [mc-26.3]
    paths: ['probe-classes.txt', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - name: Versions
        run: |
          echo "== fabric-api for 26.3"; curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+26.3[^<]*</version>" | tail -3
          echo "== loom"; curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o "<version>1\.1[7-9][^<]*</version>" | tail -4
          echo "== loader"; curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml | grep -o "<release>[^<]*"
          echo "== game versions"; curl -fsSL https://meta.fabricmc.net/v2/versions/game | python3 -c "import json,sys; print([v['version'] for v in json.load(sys.stdin)[:6]])"
          echo "== mcef-modern 26.3"; curl -fsSL 'https://api.modrinth.com/v2/project/mcef-modern/version?game_versions=%5B%2226.3%22%5D' | python3 -c "import json,sys; [print(v['version_number'], v['date_published'][:10]) for v in json.load(sys.stdin)]"
      - name: Signatures
        run: |
          url=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | python3 -c "import json,sys; d=json.load(sys.stdin); print([v['url'] for v in d['versions'] if v['id']=='26.3'][0])")
          jar=$(curl -fsSL "$url" | python3 -c "import json,sys; print(json.load(sys.stdin)['downloads']['client']['url'])")
          curl -fsSL -o client.jar "$jar"
          libs=$(curl -fsSL "$url" | python3 -c "
          import json,sys
          for l in json.load(sys.stdin)['libraries']:
              a=l.get('downloads',{}).get('artifact')
              if a: print(a['url'])")
          for l in $libs; do curl -fsSL -o "lib_$(basename $l)" "$l"; done
          CP="client.jar:$(ls lib_*.jar 2>/dev/null | tr '\n' ':')"
          while read -r c; do
            [ -z "$c" ] && continue
            case "$c" in \#*) continue;; esac
            if [[ "$c" == find:* ]]; then echo "== find ${c#find:}"; for j in client.jar lib_*.jar; do unzip -l "$j" 2>/dev/null | awk '{print $4}' | grep -i "${c#find:}" | grep -v '\$' | sed "s|^|$j: |" | head -12; done; continue; fi
            if [[ "$c" == pkg:* ]]; then
              cls=$(unzip -l client.jar | awk '{print $4}' | grep "^${c#pkg:}/[^/]*\.class$" | sed 's/\.class$//; s#/#.#g')
              echo "== package ${c#pkg:}"; javap -public -cp "$CP" $cls 2>&1
              continue
            fi
            echo "== $c"; javap -public -cp "$CP" "$c" 2>&1 | head -400
          done < probe-classes.txt > api.txt
          wc -l api.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          mkdir -p /tmp/out && cp api.txt /tmp/out/ && cd /tmp/out && git init -q -b probe-out && git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
