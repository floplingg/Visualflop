name: Probe 26.3
on:
  push:
    branches: [mc-26.3]
    paths: ['probe-classes.txt', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - name: Versions
        run: |
          echo "== fabric-api for 26.3"; curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+26.3[^<]*</version>" | tail -3
          echo "== loom"; curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o "<version>1\.1[7-9][^<]*</version>" | tail -4
          echo "== loader"; curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml | grep -o "<release>[^<]*"
          echo "== game versions"; curl -fsSL https://meta.fabricmc.net/v2/versions/game | python3 -c "import json,sys; print([v['version'] for v in json.load(sys.stdin)[:6]])"
          echo "== mcef-modern 26.3"; curl -fsSL 'https://api.modrinth.com/v2/project/mcef-modern/version?game_versions=%5B%2226.3%22%5D' | python3 -c "import json,sys; [print(v['version_number'], v['date_published'][:10]) for v in json.load(sys.stdin)]"
      - name: Signatures
        env:
          FAPI: 0.166.2+26.3
        run: |
          url=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | python3 -c "import json,sys; d=json.load(sys.stdin); print([v['url'] for v in d['versions'] if v['id']=='26.3'][0])")
          jar=$(curl -fsSL "$url" | python3 -c "import json,sys; print(json.load(sys.stdin)['downloads']['client']['url'])")
          curl -fsSL -o client.jar "$jar"
          libs=$(curl -fsSL "$url" | python3 -c "
          import json,sys
          for l in json.load(sys.stdin)['libraries']:
              a=l.get('downloads',{}).get('artifact')
              if a: print(a['url'])")
          for l in $libs; do curl -fsSL -o "lib_$(basename $l)" "$l"; done
          CP="client.jar:$(ls lib_*.jar 2>/dev/null | tr '\n' ':')"
          while read -r c; do
            [ -z "$c" ] && continue
            case "$c" in \#*) continue;; esac
            if [[ "$c" == find:* ]]; then echo "== find ${c#find:}"; for j in client.jar lib_*.jar; do unzip -l "$j" 2>/dev/null | awk '{print $4}' | grep -i "${c#find:}" | grep -v '\$' | sed "s|^|$j: |" | head -12; done; continue; fi
            if [[ "$c" == pkg:* ]]; then
              cls=$(unzip -l client.jar | awk '{print $4}' | grep "^${c#pkg:}/[^/]*\.class$" | sed 's/\.class$//; s#/#.#g')
              echo "== package ${c#pkg:}"; javap -public -cp "$CP" $cls 2>&1
              continue
            fi
            if [[ "$c" == priv:* ]]; then echo "== private ${c#priv:}"; javap -p -cp "$CP" "${c#priv:}" 2>&1 | head -300; continue; fi
            if [[ "$c" == grepfield:* ]]; then echo "== grepfield ${c#grepfield:}"; for k in $(unzip -l client.jar | awk '{print $4}' | grep '^net/minecraft/client/renderer/.*\.class$\|^net/minecraft/util/.*\.class$' | sed 's/\.class$//; s#/#.#g'); do javap -public -cp "$CP" "$k" 2>/dev/null | grep -q "${c#grepfield:}" && echo "$k"; done | head -10; continue; fi
            if [[ "$c" == jar:* ]]; then echo "== file ${c#jar:}"; unzip -p client.jar "${c#jar:}" 2>&1 | head -200; continue; fi
            if [[ "$c" == code:* ]]; then echo "== code ${c#code:}"; javap -p -c -cp "$CP" "${c#code:}" 2>&1 | grep -E "invoke|getstatic|putstatic|ldc" | sed -E 's/^ *[0-9]+: //' | head -1500; continue; fi
            if [[ "$c" == fapi:* ]]; then
              if [ ! -d fapi ]; then
                curl -fsSL -o fapi.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${FAPI}/fabric-api-${FAPI}.jar"
                mkdir fapi && (cd fapi && unzip -q ../fapi.jar 'META-INF/jars/*' && for j in META-INF/jars/*.jar; do unzip -qo "$j" -d classes 2>/dev/null; done)
              fi
              q="${c#fapi:}"
              if [[ "$q" == aw ]]; then echo "== fapi access wideners"; (cd fapi/classes && ls *.accesswidener *.classtweaker *.ct 2>/dev/null; for f in $(find . -maxdepth 1 -name '*.accesswidener' -o -maxdepth 1 -name '*.classtweaker'); do echo "-- $f"; grep -i "RenderType\|RenderPipelines\|RenderSetup\|GuiGraphicsExtractor\|Font \|LevelRenderer" "$f"; done); continue; fi
              if [[ "$q" == find:* ]]; then echo "== fapi find ${q#find:}"; (cd fapi/classes && find . -name "*.class" | grep -i "${q#find:}" | grep -v '\$' | head -40); continue; fi
              echo "== fapi $q"; javap -public -cp "fapi/classes:$CP" "$q" 2>&1 | head -200; continue
            fi
            echo "== $c"; javap -public -cp "$CP" "$c" 2>&1 | head -400
          done < probe-classes.txt > api.txt
          # Full signature index (public + protected) of client, util and rendering classes, for local searching.
          unzip -l client.jar | awk '{print $4}' | grep -E '^(net/minecraft/client|net/minecraft/util|com/mojang)/.*\.class$' | sed 's/\.class$//; s#/#.#g' > classes.txt
          true || xargs -a classes.txt -n 400 javap -protected -cp "$CP" 2>/dev/null > sigs.txt || true
          if false; then (cd fapi/classes && find net/fabricmc/fabric/api -name '*.class' | sed 's/\.class$//; s#/#.#g') > fclasses.txt; xargs -a fclasses.txt -n 400 javap -protected -cp "fapi/classes:$CP" 2>/dev/null > fsigs.txt || true; fi
          touch sigs.txt.gz
          ls -la sigs.txt.gz fsigs.txt.gz || true
          wc -l api.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          mkdir -p /tmp/out && cp api.txt sigs.txt.gz /tmp/out/ && (cp fsigs.txt.gz /tmp/out/ || true) && cd /tmp/out && git init -q -b probe-out && git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
