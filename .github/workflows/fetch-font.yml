name: Fetch UI font
on: workflow_dispatch
permissions:
  contents: write
jobs:
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Manrope and JetBrains Mono (SIL Open Font License)
        run: |
          set -e
          dir=src/main/resources/assets/flopvisuals/font
          mkdir -p $dir
          # JetBrains Mono SemiBold, unhinted web build (renders smooth in Minecraft), back to TTF with fontTools.
          pip install -q fonttools
          npm pack -q @fontsource/jetbrains-mono
          tar xzf fontsource-jetbrains-mono-*.tgz
          python -c "from fontTools.ttLib import TTFont; f=TTFont('package/files/jetbrains-mono-latin-600-normal.woff'); f.flavor=None; f.save('$dir/jetbrainsmono-semibold.ttf')"
          rm -rf package fontsource-jetbrains-mono-*.tgz
          ls -la $dir
      - name: Commit
        run: |
          git config user.name floplingg && git config user.email floplingg@users.noreply.github.com
          git add src/main/resources/assets/flopvisuals/font
          git commit -m "Unhinted JetBrains Mono" && git push
