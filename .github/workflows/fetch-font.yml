name: Fetch UI font
on: workflow_dispatch
permissions:
  contents: write
jobs:
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Manrope and JetBrains Mono (SIL Open Font License)
        run: |
          set -e
          dir=src/main/resources/assets/flopvisuals/font
          mkdir -p $dir
          # Manrope static weights (Latin + Latin Extended) from Fontsource's CDN.
          for w in 500:medium 600:semibold 700:bold 800:extrabold; do
            n=${w%%:*}; name=${w##*:}
            curl -fsSL -o $dir/manrope-$name.ttf "https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-$n-normal.ttf"
            curl -fsSL -o $dir/manrope-$name-ext.ttf "https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-ext-$n-normal.ttf"
          done
          curl -fsSL -o $dir/MANROPE-LICENSE.txt https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/OFL.txt
          curl -fsSL -o jbm.zip https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip
          f=$(unzip -l jbm.zip | grep -oE "[^ ]*ttf/JetBrainsMono-SemiBold\.ttf" | head -1)
          unzip -p jbm.zip "$f" > $dir/jetbrainsmono-semibold.ttf
          lic=$(unzip -l jbm.zip | grep -oE "[^ ]*OFL\.txt" | head -1)
          unzip -p jbm.zip "$lic" > $dir/JETBRAINSMONO-LICENSE.txt
          ls -la $dir
      - name: Commit
        run: |
          git config user.name floplingg && git config user.email floplingg@users.noreply.github.com
          git add src/main/resources/assets/flopvisuals/font
          git commit -m "Add Manrope and JetBrains Mono fonts (OFL)" && git push
