name: prodtest
on:
  push:
    branches: [prodtest]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 >/dev/null
          pip install -q portablemc
          mkdir -p mc/mods
          FAPI=$(curl -fsSL 'https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22fabric%22%5D' | python3 -c "import json,sys; v=json.load(sys.stdin)[0]; print(v['files'][0]['url'])")
          echo "fabric api: $FAPI"; curl -fsSL -o mc/mods/fabric-api.jar "$FAPI"
          curl -fsSL -o "mc/mods/flop-visuals.jar" "https://github.com/floplingg/Visualflop/releases/download/v0.16.0%2B26.3/flop-visuals-0.16.0%2B26.3.jar"
          ls -la mc/mods
          sudo apt-get install -yq xdotool imagemagick >/dev/null
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset & sleep 2
          export DISPLAY=:99
          (timeout 300 portablemc --main-dir "$PWD/mc" start fabric:26.3 -u Tester > game.out 2>&1 &)
          for i in $(seq 1 30); do sleep 5; grep -q "Created: 512x512x0 minecraft:textures/atlas/shulker" game.out && break; done
          sleep 25
          import -window root shot1.png
          W=$(xdotool search --onlyvisible --name ".+" 2>/dev/null | tail -1 || true); echo "window $W $(xdotool getwindowname $W 2>/dev/null || true)"; xdotool mousemove 640 360 click 1 || true; sleep 1; xdotool key v || true; sleep 4
          import -window root shot2.png
          (grep -iE "flop|Exception" game.out | grep -v "flite\|OpenAL\|ALSA" | head -30) || true
      - if: always()
        run: |
          mkdir out && cp shot*.png game.out out/ 2>/dev/null; cd out && git init -q && git add -A && git -c user.name=ci -c user.email=ci@x commit -qm shots
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:prod-shots
